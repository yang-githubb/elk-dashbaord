<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMT Board Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="header">
    <div class="header-title">
      <h1>SMT Board Dashboard</h1>
      <span id="status" class="status status-bad">Disconnected</span>
    </div>

    <div class="filters">
      <label class="filter">
        <span>Time</span>
        <select id="time"></select>
      </label>

      <label class="filter">
        <span>Line</span>
        <select id="line">
          <option value="">All lines</option>
        </select>
      </label>

      <label class="filter">
        <span>Model</span>
        <select id="model">
          <option value="">All models</option>
        </select>
      </label>

      <button type="button" id="refresh" class="btn">Refresh</button>
    </div>

    <div class="meta">
      <span id="updated">—</span>
      <span id="mode-label">—</span>
    </div>
  </header>

  <div id="error" class="banner banner-error hidden" role="alert">
    <span id="error-text"></span>
    <button type="button" id="retry" class="btn btn-inline">Retry</button>
  </div>

  <main class="main">
    <!-- ==========================================
     OVERVIEW
========================================== -->
    <section class="overview-section">

      <div class="overview-grid">

        <!-- Board Overview -->
        <div id="board-overview-card" class="overview-card overview-card-clickable">

          <div class="overview-header">
            <span class="overview-title">
              Board Overview
            </span>
          </div>

          <div id="board-overview-content">
            Loading...
          </div>

        </div>

        <!-- Pad Overview -->
        <div id="pad-overview-card" class="overview-card overview-card-clickable">

          <div class="overview-header">
            <span class="overview-title">
              Pad Overview
            </span>
          </div>

          <div id="pad-overview-content">
            Loading...
          </div>

        </div>

      </div>

    </section>

    <!-- ==========================================
     FAILURE PARETO
========================================== -->
    <section class="panel">

      <div class="panel-head panel-head-with-action">

        <h3>
          Pad Failure Pareto Analysis
        </h3>

        <button type="button" id="pareto-toggle" class="btn btn-inline hidden">
          View Failure Pareto
        </button>

      </div>

      <div id="pareto-panel" class="panel hidden">

        <div id="pareto-chart"></div>

      </div>

    </section>
    <section id="board-panel" class="panel panel-table">
      <div class="panel-head panel-head-split">
        <div>
          <h2>Board Serial Numbers</h2>
          <span class="panel-hint">Click a serial to view pad inspection data</span>
        </div>
        <span id="loading-tag" class="loading-tag hidden">Updating…</span>
      </div>

      <div class="board-toolbar">
        <input type="text" id="board-search" class="search-box" placeholder="Search board serial..." />
        <button type="button" id="export-boards" class="btn">Export Boards</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead id="board-thead"></thead>
          <tbody id="board-tbody"></tbody>
        </table>
      </div>

      <div class="pager">
        <button type="button" id="board-prev" class="btn">Previous</button>
        <span id="board-page-info">Page 1 of 1</span>
        <button type="button" id="board-next" class="btn">Next</button>
      </div>
    </section>

    <section id="pad-panel" class="panel panel-table hidden">
      <div class="panel-head panel-head-split">
        <div class="panel-head-left">
          <button type="button" id="back-boards" class="btn btn-back">← Boards</button>
          <button type="button" id="export-board" class="btn">Export Excel</button>
          <h2 id="pad-detail-heading">Pads for <span id="pad-serial-label" class="serial-label"></span></h2>
        </div>
        <span id="pad-loading-tag" class="loading-tag hidden">Loading…</span>
      </div>
      <div class="pad-toolbar">
        <input type="text" id="pad-search" class="search-box" placeholder="Search pad, component, result..." />
      </div>
      <div class="table-wrap">
        <table>
          <thead id="pad-thead"></thead>
          <tbody id="pad-tbody"></tbody>
        </table>
      </div>

      <div class="pager">
        <button type="button" id="pad-prev" class="btn">Previous</button>
        <span id="pad-page-info">Page 1 of 1</span>
        <button type="button" id="pad-next" class="btn">Next</button>
      </div>
    </section>
  </main>

  <!-- Config (order matters) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="config/environments.js"></script>
  <script src="config/schema.spi.js"></script>
  <script src="config/settings.js"></script>
  <script src="config/bootstrap.js"></script>

  <!-- App -->
  <script src="js/config-access.js"></script>
  <script src="js/es-queries.js"></script>
  <script src="js/es-client.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
