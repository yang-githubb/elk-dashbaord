<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ELK Dashboards</title>
  <link rel="stylesheet" href="shared/styles.css" />
</head>

<body>
  <header class="header">
    <div class="header-title">
      <h1>ELK Dashboards</h1>
    </div>
    <nav class="dashboard-tabs"></nav>
  </header>

  <main class="hub-main">
    <p class="hub-intro">
      Choose a data source. Each dashboard lives in its own folder under
      <code>dashboards/</code> with a dedicated schema and pages.
    </p>
    <div id="hub-grid" class="hub-grid"></div>
  </main>

  <script src="shared/js/registry.js"></script>
  <script src="shared/js/shell.js"></script>
  <script>
    (function () {
      const grid = document.getElementById("hub-grid");
      const registry = window.DASHBOARD_REGISTRY || [];

      grid.innerHTML = registry
        .map(
          (entry) => `
            <a class="hub-card" href="/${entry.path}">
              <h2>${entry.label}</h2>
              <p>${entry.description || ""}</p>
              <span class="hub-card-station">${entry.station || entry.id}</span>
            </a>
          `
        )
        .join("");
    })();
  </script>
</body>

</html>
