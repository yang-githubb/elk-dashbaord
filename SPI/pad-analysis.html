<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPI Failure Analysis</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <div class="panel">

            <div class="panel-head">
                <h2 id="failure-title">
                    Failure Analysis
                </h2>

                <button id="back-dashboard">
                    ← Dashboard
                </button>
            </div>

        </div>

        <div class="panel">

            <div class="panel-head">
                <h3>Failure by Line</h3>
            </div>

            <table class="data-table">
                <thead id="line-failure-thead"></thead>
                <tbody id="line-failure-tbody"></tbody>
            </table>

        </div>

        <div class="panel">

            <div class="panel-head">
                <h3>Failure by Model</h3>
            </div>

            <div class="table-scroll">
                <table class="data-table">
                    <thead id="model-failure-thead"></thead>
                    <tbody id="model-failure-tbody"></tbody>
                </table>
            </div>
        </div>

        <div class="panel">

            <div class="panel-head">
                <h3>Failure by Pad</h3>
            </div>

            <div class="table-scroll">
                <table class="data-table">
                    <thead id="pad-failure-thead"></thead>
                    <tbody id="pad-failure-tbody"></tbody>
                </table>
            </div>

        </div>

    </div>

    <!-- Config -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="config/environments.js"></script>
    <script src="config/schema.spi.js"></script>
    <script src="config/settings.js"></script>
    <script src="config/bootstrap.js"></script>

    <!-- App -->
    <script src="js/config-access.js"></script>
    <script src="js/es-queries.js"></script>
    <script src="js/es-client.js"></script>
    <script src="js/ui.js"></script>

    <!-- Analysis -->
    <script src="js/pad-analysis.js"></script>

</body>

</html>
