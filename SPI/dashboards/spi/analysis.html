<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPI Analysis</title>
  <link rel="stylesheet" href="../../shared/styles.css">
</head>

<body>
  <header class="header">
    <div class="header-title">
      <h1>SPI Analysis</h1>
    </div>
    <nav class="dashboard-tabs"></nav>
  </header>

  <main class="main">
    <section class="panel">
      <div class="panel-head panel-head-split">
        <div>
          <h2>Board Analysis</h2>
          <span class="panel-hint">KPI breakdown by Line and Model</span>
        </div>
        <button type="button" id="back-dashboard" class="btn">← Dashboard</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h3>Line KPI</h3>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="line-kpi-thead"></thead>
          <tbody id="line-kpi-tbody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h3>Model KPI</h3>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="model-kpi-thead"></thead>
          <tbody id="model-kpi-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="../../shared/config/environments.js"></script>
  <script src="../../shared/config/user.js"></script>
  <script src="./schema.js"></script>
  <script src="../../shared/config/settings.js"></script>
  <script>
    window.DASHBOARD_PAGE = { id: "spi", schemaKey: "SPI" };
    window.DASHBOARD_USER_CONFIG = {
      ...(window.DASHBOARD_USER_CONFIG || {}),
      schema: "SPI",
    };
  </script>
  <script src="../../shared/config/bootstrap.js"></script>
  <script src="../../shared/js/registry.js"></script>
  <script src="../../shared/js/shell.js"></script>
  <script src="../../shared/js/config-access.js"></script>
  <script src="../../shared/js/es-queries.js"></script>
  <script src="../../shared/js/es-client.js"></script>
  <script src="../../shared/js/ui.js"></script>
  <script src="./js/analysis.js"></script>
</body>

</html>
